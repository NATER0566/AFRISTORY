<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111111">
  <title>AfroStory | Watch something real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      /* YOUR OLD STYLES - KEPT */
     .discover-filters { display: flex; gap: 12px; margin: 0 0 24px; }
     .discover-filters label { color: #999; display: flex; flex-direction: column; font-size: 11px; gap: 6px; }
     .discover-filters select { background: #242424; border: 1px solid #343434; border-radius: 6px; color: #f5f5f5; padding: 9px 28px 9px 10px; }
     .profile-form { max-width: 520px; }
     .save-current { bottom: 28px; position: fixed; right: 28px; z-index: 10; }

      /* === FIXED HEADER: SINGLE CIRCLE === */
     .topbar { display: flex; justify-content: space-between; align-items: center; padding: 0 4vw; height: 70px; background: #111; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 50; }
     .topbar-actions { display: flex; align-items: center; gap: 18px; }
     .notification-button{ position:relative; align-items:center;background:#242424;border:1px solid #3b3b3b;border-radius:50%;display:inline-flex;height:42px;justify-content:center;width:42px; }
     .notification-button.notification-badge{ position:absolute; right:-4px; top:-3px; background:#d4a017; color:#111; font-size:10px; padding:2px 6px; border-radius:10px; font-weight:bold; }
     .topbar.profile-chip { display:block!important; background:transparent!important; border:none!important; padding:0!important; width:44px!important; height:44px!important; border-radius:50%!important; cursor:pointer; }
     .topbar.profile-chip-avatar { display:flex!important; align-items:center!important; justify-content:center!important; width:100%!important; height:100%!important; border-radius:50%!important; background:#d4a017!important; color:#111!important; font-family:Georgia,serif!important; font-weight:700!important; font-size:20px!important; overflow:hidden!important; border:2px solid transparent!important; }
     .topbar.profile-chip-avatar img { width:100%!important; height:100%!important; object-fit:cover!important; }
     .profile-initial { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }

      /* === FIXED BOTTOM: 6 ITEMS NO SCROLL === */
     .sidebar { background:#111; border-right:1px solid #333; }
     .side-nav { display:flex; flex-direction:column; gap:4px; padding:14px; }
     .nav-item { background:none; border:none; color:#999; cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px; text-align:left; width:100%; }
     .nav-item.active { color:#d4a017; }
     .desktop-only { display:flex; }
     .mobile-only { display:none!important; }

      @media(max-width: 800px) {
       .desktop-only { display:none!important; }
       .mobile-only { display:flex!important; }
       .app-layout { flex-direction: column; }
       .sidebar { position:fixed; bottom:0; left:0; right:0; height:68px; width:100%; background:#111; border-top:1px solid #333; border-right:none; z-index:40; display:flex; padding:0; justify-content:center; }
       .side-nav { flex-direction:row; justify-content:space-around; width:100%; padding:0 2px; overflow:hidden; }
       .nav-item { flex:1 1 0; min-width:0; flex-direction:column; gap:4px; font-size:9px; justify-content:center; padding:6px 2px; white-space:nowrap; }
       .nav-item span { font-size:10px; overflow:hidden; text-overflow:ellipsis; }
       .main-content { padding-bottom:90px; }
       .sidebar-bottom { display:none; }
      }

      /* === MORE BOTTOM SHEET === */
     .bottom-sheet-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:9999; display:flex; align-items:flex-end; opacity:1; transition:opacity 0.3s; }
     .bottom-sheet-overlay.hidden { opacity:0; pointer-events:none; }
     .bottom-sheet { background:#111; border-top:1px solid #333; border-radius:24px 24px 0 0; width:100%; padding:16px 24px 36px; transform:translateY(0); transition:transform 0.3s; box-shadow:0 -10px 40px rgba(0,0,0,0.9); }
     .bottom-sheet-overlay.hidden.bottom-sheet { transform:translateY(100%); }
     .sheet-handle { width:44px; height:5px; background:#333; border-radius:4px; margin:0 auto 18px; }
     .bottom-sheet h3 { text-align:center; color:#fff; margin:0 0 20px; font-size:18px; }
     .sheet-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
     .sheet-item { background:#1a1a1a; border:1px solid #333; border-radius:14px; padding:18px 8px; display:flex; flex-direction:column; align-items:center; gap:10px; color:#f5f5f5; cursor:pointer; }
     .sheet-item:active { border-color:#d4a017; }
     .sheet-item i { font-size:22px; font-style:normal; color:#d4a017; }
     .sheet-item span { font-size:12px; }
     .sheet-logout { grid-column:span 2; background:#2a1a1a; border-color:#5a2a2a; color:#ff9a9a; }

      /* KEEP YOUR OTHER STYLES */
     .profile-cover{background:linear-gradient(120deg,#2b2114,#171717 52%,#222);border:1px solid #343434;min-height:230px;padding:28px 32px;position:relative;overflow:hidden}.profile-cover[style]{background-position:center;background-size:cover}.profile-header{align-items:flex-end;display:flex;gap:22px;min-height:174px}.profile-avatar{align-items:center;background:#d4a017;color:#111;display:flex;flex:0 0 104px;font-family:Georgia,serif;font-size:48px;height:104px;justify-content:center;overflow:hidden;border-radius:50%;}.profile-avatar img{height:100%;object-fit:cover;width:100%}.profile-identity{max-width:650px}.profile-identity h1{font-size:clamp(30px,4vw,52px)}.profile-handle{margin:4px 0 10px}.profile-bio{color:#ddd;margin:0}.profile-location{color:#d4a017;font-size:13px;margin-top:10px}.profile-actions{display:flex;gap:10px;margin-left:auto}.profile-tabs{border-bottom:1px solid #343434;display:flex;gap:24px;overflow:auto;padding:0 4px}.profile-tab{background:none;border:0;border-bottom:2px solid transparent;color:#999;padding:16px 4px;white-space:nowrap}.profile-tab.active,.profile-tab:hover{border-color:#d4a017;color:#f5f5f5}.profile-panel{padding-top:30px}
    </style>
</head>
<body class="app-page">
  <header class="topbar">
    <a class="brand" href="#discover"><span class="brand-mark">A</span><span>AFRO<span>STORY</span></span></a>
    <div class="topbar-actions">
      <button class="icon-button notification-button" data-action="notifications"><span>🔔</span><i id="notification-badge" class="notification-badge hidden">0</i></button>
      <!-- SINGLE CIRCLE PROFILE -->
      <button class="profile-chip" data-action="profile" title="Profile"><span id="user-avatar" class="profile-chip-avatar"><span id="user-initial" class="profile-initial">A</span></span></button>
    </div>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="side-nav" aria-label="Main navigation">
        <!-- DESKTOP: ALL 10 ITEMS | MOBILE: ONLY 5 + MORE = 6 VISIBLE -->
        <button class="nav-item active" data-section="discover">⌂<span>Discover</span></button>
        <button class="nav-item" data-section="search">⌕<span>Search</span></button>
        <button class="nav-item" data-section="watch">▶<span>Watch</span></button>
        <button class="nav-item" data-section="wallet">◈<span>Wallet</span></button>
        <button class="nav-item" data-section="creator">✦<span>Studio</span></button>
        <button class="nav-item mobile-only" id="mobile-more-btn">⋯<span>More</span></button>

        <!-- DESKTOP ONLY ITEMS (HIDDEN ON MOBILE) -->
        <button class="nav-item desktop-only" data-section="trending">↗<span>Trending</span></button>
        <button class="nav-item desktop-only" data-section="continue">◷<span>Continue</span></button>
        <button class="nav-item desktop-only" data-section="favorites">♡<span>Favorite</span></button>
        <button class="nav-item desktop-only" data-section="history">◴<span>History</span></button>
        <button class="nav-item desktop-only" data-section="rewards">✧<span>Rewards</span></button>
        <button class="nav-item desktop-only" data-section="settings">⚙<span>Settings</span></button>
        <button class="nav-item desktop-only" data-action="logout">↪<span>Logout</span></button>
      </nav>
    </aside>
    <main class="main-content">
      <!-- YOUR SECTIONS STAY SAME -->
      <section id="section-discover" class="app-section"><div id="series-grid" class="content-grid"></div></section>
      <!--... keep all your other sections as before... -->
    </main>
  </div>

  <!-- MOBILE MORE SHEET - CONTAINS THE REST + LOGOUT -->
  <div id="mobile-more-sheet" class="bottom-sheet-overlay hidden">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <h3>More</h3>
      <div class="sheet-grid">
        <button class="sheet-item" data-section="trending"><i>↗</i><span>Trending</span></button>
        <button class="sheet-item" data-section="rewards"><i>✧</i><span>Rewards</span></button>
        <button class="sheet-item" data-section="continue"><i>◷</i><span>Continue</span></button>
        <button class="sheet-item" data-section="favorites"><i>♡</i><span>Favorite</span></button>
        <button class="sheet-item" data-section="history"><i>◴</i><span>History</span></button>
        <button class="sheet-item" data-section="settings"><i>⚙</i><span>Settings</span></button>
        <button class="sheet-item sheet-logout" data-action="logout"><i>↪</i><span>Sign out</span></button>
      </div>
    </div>
  </div>

  <div id="modal-root" class="modal-root hidden"></div>
  <script type="module" src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const moreBtn = document.getElementById('mobile-more-btn');
      const sheet = document.getElementById('mobile-more-sheet');
      if(moreBtn && sheet){
        moreBtn.addEventListener('click', e=>{ e.preventDefault(); sheet.classList.remove('hidden'); });
        sheet.addEventListener('click', e=>{ if(e.target===sheet) sheet.classList.add('hidden'); });
        sheet.querySelectorAll('.sheet-item').forEach(btn=> btn.addEventListener('click', ()=> sheet.classList.add('hidden')));
      }
    });
  </script>
</body>
</html>
